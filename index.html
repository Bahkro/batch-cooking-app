<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Cooking - Application Web</title>
  <!-- Chargement des dépendances via CDNJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root">
    <div class="p-8 text-center text-slate-500 font-sans">Chargement de l'application...</div>
  </div>

  <script type="text/babel">
    const databaseSemaines = [
      {
        planning: [
          { jour: "Lundi", midi: "🥕 Risotto de carottes au cumin (+ Paupiette Nico)", soir: "🍲 Daube douce de navets, carottes & patates" },
          { jour: "Mardi", midi: "🥔 Hachis parmentier aux légumes & champignons (+ Viande Nico)", soir: "🥦 Poêlée rôtie de chou-fleur & carottes au sésame" },
          { jour: "Mercredi", midi: "🍲 Daube douce de navets, carottes & patates (Reste)", soir: "🥕 Risotto de carottes au cumin (Reste)" },
          { jour: "Jeudi", midi: "🥔 Hachis parmentier (Reste)", soir: "🥦 Poêlée rôtie de chou-fleur & carottes (Reste)" },
          { jour: "Vendredi", midi: "🥦 Poêlée rôtie de chou-fleur & carottes (+ Paupiette Nico)", soir: "🍲 Daube douce de navets, carottes & patates (Reste)" }
        ],
        courses: {
          legumes: ["Pommes de terre : 2,3 kg", "Carottes : 2,5 kg", "Navets : 1 kg", "Chou-fleur : 1,2 kg", "Champignons : 250 g", "Ail, Oignons, Persil, Thym"],
          epicerie: ["Riz Arborio (Nico) / PCU (Loïc)", "Riz classique (Nico) / PCU (Loïc)", "Concentré de tomate", "Cumin, Sésame, Huile d'olive"],
          proteines: ["Paupiettes (Nico) : 2 à 4 pcs", "Viande hachée / Thon (Nico) : 250 g", "Parmesan râpé"]
        },
        recettes: [
          { titre: "Risotto de carottes au cumin", pas: "Faites rôtir des dés de carottes au cumin. Lancez la base de risotto. Incorporez les carottes et le persil.", nico: "Ajouter du parmesan et une paupiette poêlée.", loic: "Utiliser exclusivement le substitut de riz PCU." },
          { titre: "Daube douce de navets & carottes", pas: "Faites revenir oignons, navets et carottes. Ajoutez le concentré de tomate, le thym, l'ail et mouillez au bouillon.", nico: "Peut se déguster avec une portion de paupiette.", loic: "Nature ou avec supplément de pommes de terre." },
          { titre: "Hachis Parmentier aux légumes", pas: "Faites revenir champignons et carottes. Préparez une purée de pommes de terre. Étalez légumes + purée.", nico: "Ajouter de la viande hachée/thon au fond et gratiner au parmesan.", loic: "Garder la portion 100% légumes et purée sans protéines." },
          { titre: "Poêlée rôtie chou-fleur & carottes", pas: "Détaillez le chou-fleur et les carottes. Enfournez à 200°C pendant 25 min avec de l'huile d'olive.", nico: "Servir avec du riz classique et de la viande.", loic: "Servir avec du substitut de riz PCU." }
        ]
      }
    ];

    const propositionsRemplacement = [
      { nom: "🥧 Tarte fine aux poireaux & pommes", desc: "Poireaux fondants & tranches de pommes rôties." },
      { nom: "🍛 Curry de patates douces & coco", desc: "Douceur de coco, patates douces et épices douces." },
      { nom: "🥘 Blanquette printanière de légumes", desc: "Carottes, navets et courgettes nappés d'une sauce crémeuse." }
    ];

    function App() {
      const [tab, setTab] = React.useState('planning');
      const [semaineData, setSemaineData] = React.useState(databaseSemaines[0]);
      const [selectedSlot, setSelectedSlot] = React.useState(null);
      const [newRecipeChoice, setNewRecipeChoice] = React.useState(propositionsRemplacement[0].nom);

      const confirmerRemplacement = () => {
        if (!selectedSlot) return;
        const newPlanning = [...semaineData.planning];
        newPlanning[selectedSlot.dayIndex][selectedSlot.type] = newRecipeChoice;
        setSemaineData({ ...semaineData, planning: newPlanning });
        setSelectedSlot(null);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6 font-sans">
          <header className="text-center my-6">
            <h1 className="text-3xl font-bold text-emerald-700">🥘 Batch Cooking - Application Web</h1>
            <p className="text-slate-600">Adapté pour Nicolas (Sans lentilles) & Loïc (Régime PCU)</p>
          </header>

          <div className="flex flex-wrap justify-center gap-2 border-b pb-4">
            <button onClick={() => setTab('planning')} className={`px-4 py-2 rounded-lg font-medium transition ${tab === 'planning' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>📅 Planning</button>
            <button onClick={() => setTab('recettes')} className={`px-4 py-2 rounded-lg font-medium transition ${tab === 'recettes' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>🍳 Recettes Détaillées</button>
            <button onClick={() => setTab('courses')} className={`px-4 py-2 rounded-lg font-medium transition ${tab === 'courses' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>🛒 Courses</button>
          </div>

          {tab === 'planning' && (
            <section className="bg-white p-6 rounded-xl shadow-md space-y-4">
              <h2 className="text-xl font-semibold text-emerald-600 border-b pb-2">📅 Planning de la Semaine</h2>
              <div className="grid gap-3">
                {semaineData.planning.map((p, index) => (
                  <div key={index} className="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-slate-50 rounded-lg border gap-2">
                    <span className="font-bold text-slate-700 w-24 shrink-0">{p.jour}</span>
                    <div onClick={() => setSelectedSlot({ dayIndex: index, type: 'midi', oldTitle: p.midi })} className="text-sm cursor-pointer hover:bg-emerald-50 p-1.5 rounded transition flex-1 border border-transparent hover:border-emerald-200">
                      <strong>Midi :</strong> {p.midi}
                    </div>
                    <div onClick={() => setSelectedSlot({ dayIndex: index, type: 'soir', oldTitle: p.soir })} className="text-sm cursor-pointer hover:bg-emerald-50 p-1.5 rounded transition flex-1 border border-transparent hover:border-emerald-200">
                      <strong>Soir :</strong> {p.soir}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {tab === 'recettes' && (
            <section className="bg-white p-6 rounded-xl shadow-md space-y-6">
              <h2 className="text-xl font-semibold text-emerald-600 border-b pb-2">🍳 Fiches Recettes Détaillées</h2>
              <div className="grid gap-6">
                {semaineData.recettes.map((r, i) => (
                  <div key={i} className="border rounded-xl p-5 bg-slate-50 space-y-3">
                    <h3 className="text-lg font-bold text-slate-800 border-b pb-1">{r.titre}</h3>
                    <p className="text-sm text-slate-700"><strong>Préparation :</strong> {r.pas}</p>
                    <div className="grid sm:grid-cols-2 gap-3 pt-2">
                      <div className="bg-blue-50 p-3 rounded-lg border border-blue-100 text-xs text-blue-900"><strong>🥩 Option Nicolas :</strong> {r.nico}</div>
                      <div className="bg-purple-50 p-3 rounded-lg border border-purple-100 text-xs text-purple-900"><strong>🥗 Option Loïc (PCU) :</strong> {r.loic}</div>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {tab === 'courses' && (
            <section className="bg-white p-6 rounded-xl shadow-md space-y-6">
              <h2 className="text-xl font-semibold text-emerald-600 border-b pb-2">🛒 Liste de Courses</h2>
              <div className="grid sm:grid-cols-3 gap-4">
                <div className="bg-emerald-50 p-4 rounded-lg">
                  <h3 className="font-bold text-emerald-800 mb-2">🥦 Légumes & Herbes</h3>
                  <ul className="text-sm space-y-1 list-disc list-inside">
                    {semaineData.courses.legumes.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
                <div className="bg-amber-50 p-4 rounded-lg">
                  <h3 className="font-bold text-amber-800 mb-2">📦 Épicerie</h3>
                  <ul className="text-sm space-y-1 list-disc list-inside">
                    {semaineData.courses.epicerie.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
                <div className="bg-rose-50 p-4 rounded-lg">
                  <h3 className="font-bold text-rose-800 mb-2">🥩 Protéines (Nicolas)</h3>
                  <ul className="text-sm space-y-1 list-disc list-inside">
                    {semaineData.courses.proteines.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
              </div>
            </section>
          )}

          {selectedSlot && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-800">🔄 Remplacer une recette</h3>
                <p className="text-sm text-slate-600">
                  Modifier le repas du <strong>{semaineData.planning[selectedSlot.dayIndex]?.jour} ({selectedSlot.type})</strong> :
                </p>
                <div className="p-3 bg-slate-100 rounded-lg text-xs text-slate-500 line-through">{selectedSlot.oldTitle}</div>
                <select value={newRecipeChoice} onChange={(e) => setNewRecipeChoice(e.target.value)} className="w-full p-2.5 border rounded-lg text-sm bg-white">
                  {propositionsRemplacement.map((prop, idx) => (
                    <option key={idx} value={prop.nom}>{prop.nom} — {prop.desc}</option>
                  ))}
                </select>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setSelectedSlot(null)} className="px-4 py-2 rounded-lg text-slate-600 text-sm hover:bg-slate-100">Annuler</button>
                  <button onClick={confirmerRemplacement} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 shadow">Confirmer</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
