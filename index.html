<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Cooking - Application Web</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root">
    <div class="p-8 text-center text-slate-500">Chargement de l'application...</div>
  </div>

  <script type="text/babel">
    const { useState } = React;

    const planning = [
      { jour: "Lundi", midi: "Caponata aux figues fraîches & Riz", soir: "Gaspacho de tomates anciennes, poivrons & pastèque" },
      { jour: "Mardi", midi: "Tarte fine aux poivrons rôtis & romarin", soir: "Gratin d'aubergines & courgettes au coulis de tomates" },
      { jour: "Mercredi", midi: "Tian d'été tardif", soir: "Caponata aux figues (Reste)" },
      { jour: "Jeudi", midi: "Tarte fine aux poivrons (Reste)", soir: "Tian d'été tardif (Reste)" },
      { jour: "Vendredi", midi: "Gratin d'aubergines & courgettes", soir: "Velouté glacé de courgettes au lait de coco & menthe" }
    ];

    const courses = {
      legumes: [
        "Courgettes & Aubergines", "Tomates anciennes & Poivrons", "Figues fraîches",
        "Menthe & Basilic", "Ail & Oignons"
      ],
      epicerie: [
        "Riz (Standard / Substitut PCU)", "Lait de coco", "Huile d'olive & Epices"
      ],
      proteines: [
        "Feta / Thon (Pour Nicolas)"
      ]
    };

    function App() {
      const [tab, setTab] = useState('planning');

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6">
          <header className="text-center my-6">
            <h1 className="text-3xl font-bold text-emerald-700">🥘 Batch Cooking</h1>
            <p className="text-slate-600">Menus, recettes et liste de courses</p>
          </header>

          <div className="flex justify-center gap-2 border-b pb-4">
            <button onClick={() => setTab('planning')} className={`px-4 py-2 rounded-lg font-medium ${tab === 'planning' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>📅 Planning</button>
            <button onClick={() => setTab('courses')} className={`px-4 py-2 rounded-lg font-medium ${tab === 'courses' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>🛒 Courses</button>
          </div>

          {tab === 'planning' && (
            <section className="bg-white p-6 rounded-xl shadow-md space-y-4">
              <h2 className="text-xl font-semibold text-emerald-600 border-b pb-2">📅 Planning de la Semaine</h2>
              <div className="grid gap-3">
                {planning.map((p, index) => (
                  <div key={index} className="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-slate-50 rounded-lg border">
                    <span className="font-bold text-slate-700 w-28">{p.jour}</span>
                    <div className="text-sm"><strong>Midi :</strong> {p.midi}</div>
                    <div className="text-sm"><strong>Soir :</strong> {p.soir}</div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {tab === 'courses' && (
            <section className="bg-white p-6 rounded-xl shadow-md space-y-6">
              <h2 className="text-xl font-semibold text-emerald-600 border-b pb-2">🛒 Liste de Courses</h2>
              <div className="grid sm:grid-cols-3 gap-4">
                <div className="bg-emerald-50 p-4 rounded-lg">
                  <h3 className="font-bold text-emerald-800 mb-2">🥦 Légumes & Fruits</h3>
                  <ul className="text-sm space-y-1 list-disc list-inside">
                    {courses.legumes.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
                <div className="bg-amber-50 p-4 rounded-lg">
                  <h3 className="font-bold text-amber-800 mb-2">📦 Épicerie</h3>
                  <ul class="text-sm space-y-1 list-disc list-inside">
                    {courses.epicerie.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
                <div className="bg-rose-50 p-4 rounded-lg">
                  <h3 className="font-bold text-rose-800 mb-2">🥩 Protéines (Nicolas)</h3>
                  <ul className="text-sm space-y-1 list-disc list-inside">
                    {courses.proteines.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
              </div>
            </section>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
