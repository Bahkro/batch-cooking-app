                    <option value="Épices">Épices douces & Curry</option>
                  </select>
                </div>
              </div>

              <!-- Prévisualisation avant validation -->
              <div className="border border-indigo-200 rounded-xl p-4 bg-indigo-50/30 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-indigo-900 text-base">📌 Proposition : {propositionSemaine.titre}</h3>
                  <span className="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-semibold">{propositionSemaine.saison}</span>
                </div>
                <p className="text-xs text-slate-500">Aperçu du menu généré :</p>
                <div className="grid gap-2 text-xs">
                  {propositionSemaine.planning.slice(0, 3).map((p, idx) => (
                    <div key={idx} className="bg-white p-2 rounded border flex justify-between">
                      <span className="font-bold text-slate-700">{p.jour}</span>
                      <span className="text-slate-600">Midi: {p.midi} | Soir: {p.soir}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex justify-center pt-2">
                <button onClick={validerNouvelleSemaine} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition transform active:scale-95">
                  ✅ Valider et charger cette nouvelle semaine
                </button>
              </div>
            </section>
          )}

          <!-- Modale de changement d'un seul plat avec confirmation -->
          {selectedSlot && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-800">🔄 Remplacer cette recette</h3>
                <p className="text-sm text-slate-600">
                  Modifier le repas du <strong>{semaineData.planning[selectedSlot.dayIndex]?.jour} ({selectedSlot.type})</strong> :
                </p>
                <div className="p-3 bg-slate-100 rounded-lg text-xs text-slate-500 line-through">{selectedSlot.oldTitle}</div>
                <div className="space-y-1">
                  <label className="text-xs font-bold text-slate-700">Nouvelle recette proposée :</label>
                  <select value={newRecipeChoice} onChange={(e) => setNewRecipeChoice(e.target.value)} className="w-full p-2.5 border rounded-lg text-sm bg-white">
                    {propositionsRemplacement.map((prop, idx) => (
                      <option key={idx} value={prop.nom}>{prop.nom} — {prop.desc}</option>
                    ))}
                  </select>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setSelectedSlot(null)} className="px-4 py-2 rounded-lg text-slate-600 text-sm hover:bg-slate-100">Annuler</button>
                  <button onClick={confirmsRemplacement} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 shadow">Confirmer le changement</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
