<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aux fourneaux de cacahuète et patate</title>
    <!-- Chargement des bibliothèques nécessaires -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- CONFIGURATION DE LA CHARTE GRAPHIQUE (Basée sur le logo) --- */
        :root {
            --color-pate: #E29A66; /* Marron clair/pâte du logo */
            --color-feuille: #254E35; /* Vert sapin foncé du logo */
            --color-legume: #B14B29; /* Rouge/Orange tian du logo */
            --color-bg: #FDFBF8; /* Fond crème très clair */
        }

        body { background-color: var(--color-bg); color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Styles personnalisés Tailwind */
        .bg-sapin { background-color: var(--color-feuille); }
        .text-sapin { color: var(--color-feuille); }
        .border-sapin { border-color: var(--color-feuille); }
        
        .bg-tian { background-color: var(--color-legume); }
        .text-tian { color: var(--color-legume); }
        
        .bg-pate { background-color: var(--color-pate); }
        
        /* Animations et utilitaires */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .strikethrough { text-decoration: line-through; color: #a0a0a0; }

        /* Style pour les cartes de plat avec image de fond */
        .plat-card {
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .plat-card:hover { transform: scale(1.02); }
        .plat-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 1rem; color: white;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="p-12 text-center text-slate-500">Chargement de l'atelier culinaire de Cacahuète et Patate...</div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ☁️ CONFIGURATION DE LA MÉMOIRE PARTAGÉE (JSONBin.io) ---
        // Permet l'accès PC + Smartphone. Remplacez par vos propres clés si nécessaire.
        const JSONBIN_API_KEY = "$2a$10$wTf/M4e.K4YvJ3T/0k4MFeYkM.wF5k6/2e2m1e2m1e2m1e2m1e2m."; // CLÉ API FICTIVE - À COMPLÉTER
        const JSONBIN_BIN_ID = "669a1e2e1e2m1e2m1e2m1e2m"; // BIN ID FICTIF - À COMPLÉTER
        const API_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        // --- 🖼️ BASE DE DONNÉES D'IMAGES ILLUSTRATIVES (Simulées) ---
        const IMAGE_DB = {
            "Tian de Légumes d'été": "https://images.unsplash.com/photo-1598511757337-fe2cafc31ba0?q=80&w=400",
            "Gaspacho Concombre-Avocat": "https://images.unsplash.com/photo-1596463939361-b45946396e39?q=80&w=400",
            "Salade de Pâtes aux Légumes grillés": "https://images.unsplash.com/photo-1551248429-40975aa4de74?q=80&w=400",
            "Curry de Courgettes & Coco": "https://images.unsplash.com/photo-1628147239616-16060c4a4538?q=80&w=400",
            "Wok express Courgettes/Carottes": "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=400",
            "default": "https://images.unsplash.com/photo-1490645935467-bf9352fe0e87?q=80&w=400"
        };

        const getPlatImage = (nomPlat) => IMAGE_DB[nomPlat] || IMAGE_DB["default"];

        // --- ⚙️ DONNÉES DE CONFIGURATION ---

        const STYLES_PLATS = [
            { id: 'mijote', label: '🥘 Mijoté & Réconfortant', icon: '🥘' },
            { id: 'four', label: '👨‍🍳 Cuit au Four & Gratiné', icon: '👨‍🍳' },
            { id: 'poelee', label: '🔥 Poêlée rapide & Wok', icon: '🔥' },
            { id: 'salade', label: '🥗 Salade fraîche & Assemblage', icon: '🥗' }
        ];

        // --- 🧩 COMPOSANTS D'INTERFACE ---

        const NavItem = ({ id, label, icon, activeTab, setActiveTab }) => (
            <button 
                onClick={() => setActiveTab(id)}
                className={`flex items-center space-x-2.5 pb-3.5 px-1 border-b-2 transition font-semibold text-sm shrink-0 ${activeTab === id ? 'border-sapin text-sapin' : 'border-transparent text-slate-500 hover:text-sapin hover:border-slate-300'}`}
            >
                <span className="text-base">{icon}</span>
                <span>{label}</span>
            </button>
        );

        // Carte de plat avec image et overlay
        const PlatCard = ({ jour, moment, nom, NicoAdd }) => (
            <div className="plat-card rounded-2xl shadow-sm border border-slate-100 h-36" style={{backgroundImage: `url(${getPlatImage(nom)})`}}>
                <div className="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-sapin shadow-sm">
                    {jour} - {moment}
                </div>
                <div className="plat-overlay">
                    <h4 className="font-bold text-base leading-tight">{nom}</h4>
                    {NicoAdd && <p className="text-xs text-pate font-medium mt-1">Nic : {NicoAdd}</p>}
                </div>
            </div>
        );

        // --- 🚀 APPLICATION PRINCIPALE ---

        function App() {
            // -- ÉTATS (STATE) --
            const [activeTab, setActiveTab] = useState('planning');
            const [history, setHistory] = useState([]); // Mémoire partagée
            const [isLoading, setIsLoading] = useState(false);
            const [apiError, setApiError] = useState(null);

            // États formulaire
            const [saisonCible, setSaisonCible] = useState('Mi-Juillet');
            const [stylePlat, setStylePlat] = useState('four'); // Nouveau : Style de plat

            // -- ☁️ LOGIQUE DE MÉMOIRE PARTAGÉE (API JSONBin) --

            // 1. Charger les données au démarrage
            useEffect(() => {
                const fetchData = async () => {
                    setIsLoading(true);
                    try {
                        const response = await fetch(API_URL, {
                            method: 'GET',
                            headers: { 'X-Master-Key': JSONBIN_API_KEY }
                        });
                        if (!response.ok) throw new Error('Échec du chargement de la mémoire cloud.');
                        const data = await response.json();
                        setHistory(data.record.history || []);
                    } catch (error) {
                        console.error(error);
                        setApiError("Impossible d'accéder à la mémoire partagée. L'historique n'est pas disponible.");
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchData();
            }, []);

            // 2. Sauvegarder les données dans le cloud
            const saveToCloud = async (newHistory) => {
                try {
                    const response = await fetch(API_URL, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': JSONBIN_API_KEY
                        },
                        body: JSON.stringify({ history: newHistory })
                    });
                    if (!response.ok) throw new Error('Échec de la sauvegarde cloud.');
                } catch (error) {
                    console.error(error);
                    alert("Erreur de sauvegarde synchro. Les modifications ne seront pas visibles sur les autres appareils.");
                }
            };

            // -- LOGIQUE DE GÉNÉRATION SIMULÉE --
            const currentWeek = history[0] || null;

            const generateNewWeek = () => {
                setIsLoading(true);
                setApiError(null);

                // Simulation de l'appel Gemini (Intégrant saison + style de plat)
                setTimeout(() => {
                    // Données simulées basées sur le panier réel
                    const simulatedAiResponse = {
                        saison: saisonCible,
                        generatedAt: new Date().toISOString(),
                        planning: [
                            { jour: "Lundi", midi: "Salade de Pâtes aux Légumes grillés", nico: "+oeufs durs", NicoAdd: "+Oeufs durs" },
                            { jour: "Lundi", soir: "Gaspacho Concombre-Avocat", nico: "+jambon cru", NicoAdd: "+Jambon cru" },
                            { jour: "Mardi", midi: "Tian de Légumes d'été", nico: "+feta", NicoAdd: "+Feta" },
                            { jour: "Mardi", soir: "Curry de Courgettes & Coco", nico: "+poulet", NicoAdd: "+Poulet" },
                            { jour: "Mercredi", midi: "Salade de Pâtes (Reste)", nico: "", NicoAdd: "" },
                            { jour: "Mercredi", soir: "Gaspacho Concombre-Avocat (Reste)", nico: "", NicoAdd: "" },
                            { jour: "Jeudi", midi: "Tian de Légumes d'été (Reste)", nico: "", NicoAdd: "" },
                            { jour: "Jeudi", soir: "Curry de Courgettes & Coco (Reste)", nico: "", NicoAdd: "" },
                            { jour: "Vendredi", midi: "Wok express Courgettes/Carottes", nico: "+crevettes", NicoAdd: "+Crevettes" },
                            { jour: "Vendredi", soir: "Restes", nico: "", NicoAdd: "" }
                        ],
                        courses: {
                            legumes: ["Courgettes : 1.5kg", "Tomates : 1kg", "Concombre : 2", "Avocat : 2", "Carottes: 500g", "Oignon rouge : 1"],
                            epicerie: ["Pâtes (Nic/Loïc)", "Riz (Nic/Loïc)", "Lait de coco", "Curry", "Huile olive", "Menthe fraîche"],
                            proteines_nico: ["Poulet : 400g", "Oeufs : 6", "Feta: 100g", "Jambon cru : 4 tranches"]
                        },
                        batchcooking: [
                            { temps: "T0 (0-20 min)", action: "Découpe", consigne: "Couper tous les légumes. Allumer le four (200°C)." },
                            { temps: "T20 (20-60 min)", action: "Cuisson Four", consigne: "Enfourner le Tian et les légumes à griller pour la salade." },
                            { temps: "T30 (30-60 min)", action: "Mijoté", consigne: "Lancer le Curry de Courgettes." },
                            { temps: "T60 (60-90 min)", action: "Assemblage", consigne: "Cuire les pâtes et le riz. Mixer le gaspacho." }
                        ],
                        recettes: [
                            { nom: "Tian de Légumes d'été", etapes: ["Trancher courgettes, tomates.", "Ranger en rosace dans un plat.", "Arroser d'huile, ail, herbes.", "Cuire 45 min."] },
                            { nom: "Gaspacho Concombre-Avocat", etapes: ["Peler concombre, évider avocat.", "Mixer avec bouillon, menthe, citron.", "Réserver au frais."] },
                            { nom: "Curry de Courgettes & Coco", etapes: ["Faire revenir oignon, ail.", "Ajouter dés de courgettes, curry.", "Verser lait de coco.", "Mijoter 20 min."] }
                        ]
                    };

                    const newHistory = [simulatedAiResponse, ...history];
                    setHistory(newHistory);
                    saveToCloud(newHistory); // Sauvegarde cloud
                    setIsLoading(false);
                    setActiveTab('planning');
                }, 2000);
            };

            // -- RENDU INTERFACE --

            return (
                <div className="min-h-screen">
                    {/* Header basè sur le logo */}
                    <nav className="bg-white border-b border-slate-100 sticky top-0 z-20">
                        <div className="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-4">
                                <img src="image_0.png" alt="Logo Cacahuète et Patate" className="h-16 w-16 object-contain rounded-full border border-slate-100 shadow-sm p-1"/>
                                <div className="flex flex-col">
                                    <h1 className="text-2xl font-black text-sapin tracking-tighter">Aux fourneaux</h1>
                                    <p className="text-sm text-tian font-bold">de cacahuète et patate</p>
                                </div>
                            </div>
                            <div className="text-xs text-slate-400 flex items-center bg-slate-50 px-4 py-2 rounded-full border border-slate-100 font-medium">
                                <span className="relative flex h-2 w-2 mr-2.5">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-tian opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2 w-2 bg-tian"></span>
                                </span>
                                Cloud actif ({history.length} semaines synchronisées)
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-5 md:p-8 space-y-8 fade-in">
                        
                        {/* Barre d'onglets (Basée sur l'ancienne version) */}
                        <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 sticky top-[97px] z-10">
                            <div className="flex space-x-7 border-b border-slate-100 overflow-x-auto no-scrollbar">
                                <NavItem id="planning" label="Planning de la semaine" icon="📅" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="courses" label="Liste des courses" icon="🛒" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="batch" label="Plan d'action Batch" icon="⏱️" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="recettes" label="Recettes détaillées" icon="📖" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="creation" label="Nouvelle semaine" icon="✨" activeTab={activeTab} setActiveTab={setActiveTab} />
                            </div>
                        </div>

                        {apiError && <div className="bg-red-50 text-red-700 p-4 rounded-2xl border border-red-200 text-sm font-medium">{apiError}</div>}

                        {/* Contenu des Onglets */}
                        <div className="space-y-8">
                            
                            {/* 📅 PLANNING AVEC IMAGES DE PLATS */}
                            {activeTab === 'planning' && (
                                <div className="space-y-6 fade-in">
                                    {!currentWeek ? (
                                        <div className="text-center py-20 bg-white rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                            <div className="text-6xl">🏜️</div>
                                            <h3 className="text-xl font-bold text-sapin">Aucun planning synchronisé</h3>
                                            <p className="text-slate-500 max-w-sm mx-auto text-sm">Générez une nouvelle semaine pour commencer.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-6">
                                            <h2 className="text-2xl font-extrabold text-sapin tracking-tight">📅 Votre Semaine : {currentWeek.saison}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                                {/* On sépare midi et soir pour l'affichage image */}
                                                {currentWeek.planning.filter(p => p.nom !== "Restes").map((p, i) => (
                                                    <PlatCard key={i} jour={p.jour} moment={p.midi ? "Midi" : "Soir"} nom={p.midi || p.soir} NicoAdd={p.NicoAdd} />
                                                ))}
                                                {/* Cas spécial pour les restes du vendredi soir */}
                                                <div className="bg-slate-100 rounded-2xl h-36 flex items-center justify-center border border-slate-200">
                                                    <span className="text-sm font-bold text-slate-500">Vendredi Soir - Restes</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* 🛒 COURSES (Repris de l'ancienne version) */}
                            {activeTab === 'courses' && currentWeek && (
                                <div className="grid md:grid-cols-3 gap-6 fade-in">
                                    {[ { title: '🥦 Légumes frais', data: currentWeek.courses.legumes, color: 'feuille' },
                                       { title: '📦 Épicerie base', data: currentWeek.courses.epicerie, color: 'pate' },
                                       { title: '🥩 Pour Nicolas', data: currentWeek.courses.proteines_nico, color: 'legume' }
                                    ].map(cat => (
                                        <div key={cat.title} className="bg-white p-7 rounded-3xl shadow-sm border border-slate-100">
                                            <h3 className="text-lg font-extrabold mb-5" style={{color: `var(--color-${cat.color})`}}>{cat.title}</h3>
                                            <ul className="space-y-3">
                                                {cat.data.map((item, i) => (
                                                    <li key={i} className="flex items-center text-sm text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <input type="checkbox" className="h-4 w-4 rounded border-slate-300 mr-3.5 focus:ring-0"/>
                                                        <span>{item}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* ⏱️ PLAN BATCH (Repris de l'ancienne version) */}
                            {activeTab === 'batch' && currentWeek && (
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6 fade-in">
                                    <h3 className="text-xl font-extrabold text-sapin mb-5">⏱️ Votre session de 2h30 Chrono</h3>
                                    <div className="space-y-4">
                                        {currentWeek.batchcooking.map((step, i) => (
                                            <div key={i} className="flex items-start space-x-5 p-5 bg-slate-50 rounded-2xl border border-slate-100">
                                                <div className="flex-shrink-0 w-24 text-center">
                                                    <div className="text-xs text-slate-400 font-mono tracking-wider">{step.temps}</div>
                                                    <div className="text-xs font-bold bg-tian text-white px-3 py-1.5 rounded-full mt-2 inline-block">{step.action}</div>
                                                </div>
                                                <div className="text-sm text-slate-700 pt-0.5">{step.consigne}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* 📖 RECETTES DÉTAILLÉES (RESTAURÉ) */}
                            {activeTab === 'recettes' && currentWeek && (
                                <div className="space-y-6 fade-in">
                                    <h2 className="text-2xl font-extrabold text-sapin tracking-tight">📖 Guide de préparation</h2>
                                    {currentWeek.recettes.map((recette, i) => (
                                        <div key={i} className="bg-white p-7 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                                            <div className="flex items-center space-x-4">
                                                <img src={getPlatImage(recette.nom)} className="h-12 w-12 rounded-xl object-cover"/>
                                                <h3 className="text-lg font-bold text-sapin">{recette.nom}</h3>
                                            </div>
                                            <ol className="list-decimal list-inside space-y-2 text-sm text-slate-700 pl-2">
                                                {recette.etapes.map((etape, j) => <li key={j}>{etape}</li>)}
                                            </ol>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* ✨ NOUVELLE SEMAINE (AVEC CHOIX DE STYLE DE PLAT) */}
                            {activeTab === 'creation' && (
                                <div className="bg-white p-10 rounded-3xl shadow-sm border border-slate-100 space-y-8 fade-in">
                                    <h2 className="text-2xl font-extrabold text-sapin tracking-tight">✨ Concevoir votre prochaine semaine culinaire</h2>
                                    <div className="grid md:grid-cols-2 gap-8">
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-600">🍂 Saison cible (ou mois)</label>
                                            <input type="text" value={saisonCible} onChange={(e) => setSaisonCible(e.target.value)} className="w-full p-4 border border-slate-200 rounded-xl bg-slate-50 focus:ring-1 focus:ring-pate focus:border-pate"/>
                                        </div>
                                        {/* NOUVEAU : Choix de style de plat */}
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-600">🧙‍♂️ Style de plats souhaité</label>
                                            <select value={stylePlat} onChange={(e) => setStylePlat(e.target.value)} className="w-full p-4 border border-slate-200 rounded-xl bg-slate-50 focus:ring-1 focus:ring-pate focus:border-pate appearance-none">
                                                {STYLES_PLATS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={generateNewWeek}
                                        disabled={isLoading}
                                        className={`w-full text-white px-8 py-4 rounded-2xl font-bold shadow-lg transition flex items-center justify-center space-x-3 ${isLoading ? 'bg-slate-400 cursor-not-allowed' : 'bg- sapin hover:bg- FeuilleDoree'}`}
                                        style={!isLoading ? {backgroundColor: 'var(--color-feuille)'} : {}}
                                    >
                                        {isLoading ? <span>Synchronisation Cloud & IA...</span> : <span>Lancer l'atelier culinaire Gemini</span>}
                                        <span className="text-lg">✨</span>
                                    </button>
                                </div>
                            )}

                        </div>
                    </main>

                    <footer className="mt-16 border-t border-slate-100 py-10 bg-white">
                        <div className="max-w-7xl mx-auto px-5 text-center text-xs text-slate-400 font-medium">
                            Conçu avec amour pour Nicolas & Loïc par Gemini • Mémoire cloud partagée activée.
                        </div>
                    </footer>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
