<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aux fourneaux de Cacahuète et Patate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-slate-800">
  <div id="root">
    <div class="p-8 text-center text-slate-500 font-sans">Chargement de l'application...</div>
  </div>

  <script type="text/babel">
    const databaseSemaines = [
      {
        id: "semaine-automne-racines",
        titre: "🍂 Automne — Légumes Racines & Douceur",
        saison: "Automne",
        styles: ["Réconfortant & Mijoté", "Gratins & Tartes"],
        planning: [
          { jour: "Lundi", midi: "🥕 Risotto de carottes au cumin (+ Paupiette Nico)", soir: "🍲 Daube douce de navets, carottes & patates" },
          { jour: "Mardi", midi: "🥔 Hachis parmentier aux légumes & champignons (+ Viande Nico)", soir: "🥦 Poêlée rôtie de chou-fleur & carottes au sésame" },
          { jour: "Mercredi", midi: "🍲 Daube douce de navets, carottes & patates (Reste)", soir: "🥕 Risotto de carottes au cumin (Reste)" },
          { jour: "Jeudi", midi: "🥔 Hachis parmentier aux légumes & champignons (Reste)", soir: "🥦 Poêlée rôtie de chou-fleur & carottes au sésame (Reste)" },
          { jour: "Vendredi", midi: "🥦 Poêlée rôtie de chou-fleur & carottes (+ Paupiette Nico)", soir: "🍲 Daube douce de navets, carottes & patates (Reste)" }
        ],
        courses: {
          legumes: ["Pommes de terre : 2,3 kg", "Carottes : 2,5 kg", "Navets : 1 kg", "Chou-fleur : 1,2 kg", "Champignons : 250 g", "Ail, Oignons, Persil, Thym"],
          epicerie: ["Riz Arborio (Nico) / PCU (Loïc)", "Riz classique (Nico) / PCU (Loïc)", "Concentré de tomate", "Cumin, Sésame, Huile d'olive"],
          proteines: ["Paupiettes (Nico) : 2 à 4 pcs", "Viande hachée / Thon (Nico) : 250 g", "Parmesan râpé"]
        },
        organisation: [
          { temps: "0 - 20 min", titre: "Découpes & Four", desc: "Tailler le chou-fleur et 1 kg de carottes. Enfourner la poêlée rôtie à 200°C pendant 25 min avec huile d'olive et sésame." },
          { temps: "20 - 50 min", titre: "Les Casseroles", desc: "Lancer la daube douce (oignons, navets, carottes, concentré de tomate et bouillon). Lancer la cuisson des pommes de terre pour la purée." },
          { temps: "50 - 1h20", titre: "Assemblage Hachis & Risotto", desc: "Écraser la purée, faire revenir les champignons. Monter le hachis parmentier. Lancer la base de risotto aux carottes râpées." },
          { temps: "1h20 - 2h00", titre: "Cuisson Protéines & Féculents PCU", desc: "Poêler les paupiettes et la viande hachée de Nicolas à part. Cuire le riz classique et les féculents spécifiquement adaptés pour Loïc." },
          { temps: "2h00 - 2h30", titre: "Conditionnement", desc: "Répartir l'ensemble des plats dans les boîtes hermétiques pour la semaine et laisser refroidir." }
        ],
        recettes: [
          { titre: "1. Risotto de carottes au cumin", pas: "Faites rôtir des dés de carottes au cumin. Lancez la base de risotto avec l'oignon et le bouillon. Incorporez les carottes et le persil en fin de cuisson.", nico: "Ajouter du parmesan râpé et servir avec une paupiette poêlée.", loic: "Utiliser exclusivement le substitut de riz spécial PCU." },
          { titre: "2. Daube douce de navets & carottes", pas: "Faites revenir oignons, navets et carottes. Ajoutez le concentré de tomate, le thym, l'ail et mouillez au bouillon. Laissez mijoter à feu doux 40 min.", nico: "Accompagner d'une portion de paupiette ou viande de votre choix.", loic: "Déguster nature ou avec un supplément de pommes de terre vapeur." },
          { titre: "3. Hachis Parmentier aux légumes", pas: "Faites revenir les champignons avec l'ail. Préparez une purée de pommes de terre bien lisse. Éparpillez les légumes puis couvrez de purée.", nico: "Ajouter de la viande hachée ou du thon au fond du plat et gratiner au parmesan.", loic: "Conserver la version 100% légumes et purée (sans aucune protéine)." },
          { titre: "4. Poêlée rôtie chou-fleur & carottes", pas: "Détaillez le chou-fleur en fleurettes et les carottes en rondelles. Enfournez à 200°C pendant 25 min avec de l'huile d'olive et des graines de sésame.", nico: "Servir accompagné de riz classique et d'une paupiette.", loic: "Servir accompagné du substitut de riz/pâtes PCU." }
        ]
      }
    ];

    const propositionsRemplacement = [
      { nom: "🥧 Tarte fine aux poireaux & pommes", desc: "Poireaux fondants & tranches de pommes rôties." },
      { nom: "🍛 Curry de patates douces & coco", desc: "Douceur de coco, patates douces et épices douces." },
      { nom: "🥘 Blanquette printanière de légumes", desc: "Carottes, navets et courgettes nappés d'une sauce crémeuse." },
      { nom: "🌮 Chili Sin Carne aux poivrons & maïs", desc: "Poivrons, maïs, haricots rouges et coulis de tomate (sans lentilles)." },
      { nom: "🥗 Salade croquante concombre & maïs", desc: "Concombres, radis, maïs et vinaigrette aux herbes." },
      { nom: "🍆 Ratatouille douce aux courgettes", desc: "Courgettes, poivrons et tomates confites à l'huile d'olive." }
    ];

    const modesPreparationDisponibles = [
      "Sans cuisson", "Gazinière", "Four", "Vapeur", "Friteuse", "Mijoteuse", "Air Fryer"
    ];

    function App() {
      const [tab, setTab] = React.useState('planning');
      const [semaineData, setSemaineData] = React.useState(databaseSemaines[0]);
      const [historique, setHistorique] = React.useState([
        { ...databaseSemaines[0], dateAjout: "Semaine initiale" }
      ]);
      const [coursesCochees, setCoursesCochees] = React.useState({});
      const [selectedSlot, setSelectedSlot] = React.useState(null);
      const [newRecipeChoice, setNewRecipeChoice] = React.useState(propositionsRemplacement[0].nom);
      
      // États pour l'onglet "Nouvelle Semaine"
      const [modesCoches, setModesCoches] = React.useState([]);
      const [promptText, setPromptText] = React.useState("");

      React.useEffect(() => {
        const modesStr = modesCoches.length > 0 ? modesCoches.join(', ') : 'Libre';
        setPromptText(`Tu es un assistant de batch cooking. Génère une nouvelle semaine d'organisation (2h30 max) au format JSON.
Contraintes strictes :
- Le menu doit être adapté pour Nicolas (sans lentilles) et Loïc (régime PCU strict).
- Modes de préparation privilégiés pour cette semaine : ${modesStr}.
- Fournir 5 jours de repas (Midi/Soir), la liste de courses, l'organisation chronologique et les 4 recettes de base avec les déclinaisons Nico/Loïc.`);
      }, [modesCoches]);

      const toggleCourse = (item) => {
        setCoursesCochees(prev => ({ ...prev, [item]: !prev[item] }));
      };

      const toggleMode = (mode) => {
        setModesCoches(prev => 
          prev.includes(mode) ? prev.filter(m => m !== mode) : [...prev, mode]
        );
      };

      const validerNouvelleSemaine = () => {
        alert("En production, ce prompt serait envoyé à l'IA :\n\n" + promptText);
        // Simulation d'une nouvelle semaine générée
        setTab('planning');
      };

      const rechargerSemaineHistorique = (sem) => {
        setSemaineData(sem);
        setCoursesCochees({});
        setTab('planning');
        alert(`🔄 Le menu "${sem.titre}" a été rechargé !`);
      };

      const confirmerRemplacement = () => {
        if (!selectedSlot) return;
        const newPlanning = [...semaineData.planning];
        newPlanning[selectedSlot.dayIndex][selectedSlot.type] = newRecipeChoice;
        const nouvelleSem = { ...semaineData, planning: newPlanning };
        setSemaineData(nouvelleSem);
        setHistorique(prev => [
          { ...nouvelleSem, dateAjout: `Modifiée le ${new Date().toLocaleDateString('fr-FR')}` },
          ...prev
        ]);
        setSelectedSlot(null);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6 font-sans">
          <header className="text-center my-6">
            <img 
              src="Logo aux fourneaux de cacahuère et patate_2.jpg" 
              alt="Logo Aux Fourneaux de Cacahuète et Patate" 
              className="mx-auto h-40 object-contain drop-shadow-md mb-4"
            />
            <h1 className="text-4xl font-extrabold text-amber-900 tracking-tight">Aux fourneaux de Cacahuète et Patate</h1>
            <p className="text-amber-700/80 mt-2 font-medium">Adapté pour Nicolas (Sans lentilles) & Loïc (Régime PCU)</p>
            <div className="mt-3 inline-block bg-orange-200 text-orange-900 font-bold px-4 py-1.5 rounded-full text-sm shadow-sm border border-orange-300">
              Menu actuel : {semaineData.titre}
            </div>
          </header>

          <div className="flex flex-wrap justify-center gap-2 border-b border-orange-200 pb-4">
            <button onClick={() => setTab('planning')} className={`px-4 py-2 rounded-lg font-medium transition shadow-sm ${tab === 'planning' ? 'bg-amber-700 text-white' : 'bg-white text-slate-700 hover:bg-orange-50'}`}>📅 Planning</button>
            <button onClick={() => setTab('organisation')} className={`px-4 py-2 rounded-lg font-medium transition shadow-sm ${tab === 'organisation' ? 'bg-amber-700 text-white' : 'bg-white text-slate-700 hover:bg-orange-50'}`}>⏱️ Organisation (2h30)</button>
            <button onClick={() => setTab('recettes')} className={`px-4 py-2 rounded-lg font-medium transition shadow-sm ${tab === 'recettes' ? 'bg-amber-700 text-white' : 'bg-white text-slate-700 hover:bg-orange-50'}`}>🍳 Recettes</button>
            <button onClick={() => setTab('courses')} className={`px-4 py-2 rounded-lg font-medium transition shadow-sm ${tab === 'courses' ? 'bg-amber-700 text-white' : 'bg-white text-slate-700 hover:bg-orange-50'}`}>🛒 Courses</button>
            <button onClick={() => setTab('historique')} className={`px-4 py-2 rounded-lg font-medium transition shadow-sm ${tab === 'historique' ? 'bg-stone-700 text-white' : 'bg-white text-stone-700 hover:bg-stone-100'}`}>📚 Historique ({historique.length})</button>
            <button onClick={() => setTab('gemini')} className={`px-4 py-2 rounded-lg font-bold transition shadow-sm ${tab === 'gemini' ? 'bg-orange-600 text-white shadow-inner' : 'bg-orange-100 text-orange-800 border border-orange-300 hover:bg-orange-200'}`}>✨ Nouvelle Semaine</button>
          </div>

          {/* Planning */}
          {tab === 'planning' && (
            <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 space-y-4">
              <div className="flex justify-between items-center border-b border-orange-100 pb-2">
                <h2 className="text-xl font-bold text-amber-800">📅 Planning de la Semaine</h2>
                <span className="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded font-medium">Cliquez sur un repas pour le modifier</span>
              </div>
              <div className="grid gap-3">
                {semaineData.planning.map((p, index) => (
                  <div key={index} className="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-orange-50/50 rounded-xl border border-orange-100 gap-2">
                    <span className="font-bold text-amber-900 w-24 shrink-0">{p.jour}</span>
                    <div onClick={() => setSelectedSlot({ dayIndex: index, type: 'midi', oldTitle: p.midi })} className="text-sm cursor-pointer hover:bg-white p-2 rounded-lg transition flex-1 border border-transparent hover:border-orange-200 hover:shadow-sm">
                      <strong className="text-amber-700">Midi :</strong> {p.midi}
                    </div>
                    <div onClick={() => setSelectedSlot({ dayIndex: index, type: 'soir', oldTitle: p.soir })} className="text-sm cursor-pointer hover:bg-white p-2 rounded-lg transition flex-1 border border-transparent hover:border-orange-200 hover:shadow-sm">
                      <strong className="text-amber-700">Soir :</strong> {p.soir}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* Organisation */}
          {tab === 'organisation' && (
            <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 space-y-6">
              <h2 className="text-xl font-bold text-amber-800 border-b border-orange-100 pb-2">⏱️ Déroulé de la Session (2h30)</h2>
              <div className="space-y-4">
                {semaineData.organisation.map((item, i) => (
                  <div key={i} className="flex gap-4 p-4 bg-orange-50/50 rounded-xl border border-orange-100">
                    <span className="font-bold text-amber-800 bg-orange-200 px-3 py-1 rounded-lg text-xs self-start shrink-0">{item.temps}</span>
                    <div>
                      <h3 className="font-bold text-amber-950 text-sm">{item.titre}</h3>
                      <p className="text-sm text-slate-700 mt-1">{item.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* Recettes */}
          {tab === 'recettes' && (
            <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 space-y-6">
              <h2 className="text-xl font-bold text-amber-800 border-b border-orange-100 pb-2">🍳 Fiches des 4 Recettes</h2>
              <div className="grid gap-6">
                {semaineData.recettes.map((r, i) => (
                  <div key={i} className="border border-orange-100 rounded-xl p-5 bg-orange-50/30 space-y-3">
                    <h3 className="text-lg font-bold text-amber-900 border-b border-orange-200 pb-1">{r.titre}</h3>
                    <p className="text-sm text-slate-700"><strong>Préparation :</strong> {r.pas}</p>
                    <div className="grid sm:grid-cols-2 gap-3 pt-2">
                      <div className="bg-rose-50 p-3 rounded-lg border border-rose-100 text-xs text-rose-900"><strong>🥩 Option Nicolas :</strong> {r.nico}</div>
                      <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-100 text-xs text-emerald-900"><strong>🥗 Option Loïc (PCU) :</strong> {r.loic}</div>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* Courses */}
          {tab === 'courses' && (
            <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 space-y-6">
              <div className="flex justify-between items-center border-b border-orange-100 pb-2">
                <h2 className="text-xl font-bold text-amber-800">🛒 Liste de Courses</h2>
                <span className="text-xs text-slate-500">Cochez les ingrédients achetés</span>
              </div>
              <div className="grid sm:grid-cols-3 gap-4">
                <div className="bg-green-50/50 p-4 rounded-xl border border-green-100">
                  <h3 className="font-bold text-green-800 mb-2">🥦 Légumes</h3>
                  <div className="text-sm space-y-2">
                    {semaineData.courses.legumes.map((item, i) => (
                      <label key={i} className="flex items-start gap-2 cursor-pointer select-none">
                        <input type="checkbox" checked={!!coursesCochees[item]} onChange={() => toggleCourse(item)} className="mt-1 rounded text-green-600 focus:ring-green-500" />
                        <span className={coursesCochees[item] ? "line-through text-slate-400" : "text-slate-700"}>{item}</span>
                      </label>
                    ))}
                  </div>
                </div>
                <div className="bg-amber-50 p-4 rounded-xl border border-amber-100">
                  <h3 className="font-bold text-amber-800 mb-2">📦 Épicerie</h3>
                  <div className="text-sm space-y-2">
                    {semaineData.courses.epicerie.map((item, i) => (
                      <label key={i} className="flex items-start gap-2 cursor-pointer select-none">
                        <input type="checkbox" checked={!!coursesCochees[item]} onChange={() => toggleCourse(item)} className="mt-1 rounded text-amber-600 focus:ring-amber-500" />
                        <span className={coursesCochees[item] ? "line-through text-slate-400" : "text-slate-700"}>{item}</span>
                      </label>
                    ))}
                  </div>
                </div>
                <div className="bg-rose-50/50 p-4 rounded-xl border border-rose-100">
                  <h3 className="font-bold text-rose-800 mb-2">🥩 Protéines (Nico)</h3>
                  <div className="text-sm space-y-2">
                    {semaineData.courses.proteines.map((item, i) => (
                      <label key={i} className="flex items-start gap-2 cursor-pointer select-none">
                        <input type="checkbox" checked={!!coursesCochees[item]} onChange={() => toggleCourse(item)} className="mt-1 rounded text-rose-600 focus:ring-rose-500" />
                        <span className={coursesCochees[item] ? "line-through text-slate-400" : "text-slate-700"}>{item}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </div>
            </section>
          )}

          {/* Nouvelle Semaine (Gemini) */}
          {tab === 'gemini' && (
            <section className="bg-white p-6 rounded-2xl shadow-md border-2 border-orange-200 space-y-6 relative overflow-hidden">
              <div className="absolute top-0 right-0 bg-orange-100 text-orange-800 text-xs font-bold px-3 py-1 rounded-bl-lg">Générateur IA</div>
              <h2 className="text-2xl font-bold text-orange-700 border-b border-orange-100 pb-2">✨ Créer une nouvelle semaine</h2>
              
              <div className="space-y-5">
                <div className="bg-orange-50 p-4 rounded-xl border border-orange-100">
                  <h3 className="font-bold text-amber-900 mb-3">1. Modes de préparation à privilégier :</h3>
                  <div className="flex flex-wrap gap-3">
                    {modesPreparationDisponibles.map(mode => (
                      <label key={mode} className="flex items-center gap-2 cursor-pointer bg-white px-3 py-2 rounded-lg border border-orange-200 hover:border-orange-400 transition shadow-sm">
                        <input 
                          type="checkbox" 
                          checked={modesCoches.includes(mode)}
                          onChange={() => toggleMode(mode)} 
                          className="rounded text-orange-600 focus:ring-orange-500 w-4 h-4" 
                        />
                        <span className="text-sm font-medium text-slate-700">{mode}</span>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="bg-stone-50 p-4 rounded-xl border border-stone-200">
                  <div className="flex justify-between items-end mb-2">
                    <h3 className="font-bold text-stone-800">2. Paramètres de l'outil (Prompt IA) :</h3>
                    <span className="text-xs text-stone-500 font-medium">Éditable librement</span>
                  </div>
                  <textarea 
                    className="w-full h-40 p-3 border border-stone-300 rounded-lg text-sm text-stone-700 font-mono focus:ring-orange-500 focus:border-orange-500 shadow-inner"
                    value={promptText}
                    onChange={(e) => setPromptText(e.target.value)}
                  />
                  <p className="text-xs text-stone-500 mt-2">Ce texte est le cœur du moteur. Corrigez-le si l'IA génère des erreurs de régime ou de structure avec le temps.</p>
                </div>
                
                <button onClick={validerNouvelleSemaine} className="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-xl transition w-full shadow-md text-lg">
                  🚀 Générer le Menu avec l'IA
                </button>
              </div>
            </section>
          )}

          {/* Historique - Reconstruction complète de l'historique qui était coupé */}
          {tab === 'historique' && (
            <section className="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 space-y-6">
              <h2 className="text-xl font-bold text-stone-800 border-b border-stone-200 pb-2">📚 Historique des Semaines</h2>
              <div className="space-y-6">
                {historique.map((sem, idx) => (
                  <div key={idx} className="border border-stone-200 rounded-xl p-5 bg-stone-50 space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-stone-200 pb-3">
                      <div>
                        <h3 className="font-bold text-stone-900 text-lg">{sem.titre}</h3>
                        <span className="text-xs text-stone-500">{sem.dateAjout}</span>
                      </div>
                      <button onClick={() => rechargerSemaineHistorique(sem)} className="bg-stone-700 hover:bg-stone-800 text-white font-bold text-xs px-4 py-2 rounded-lg shadow transition">
                        🔄 Recharger ce menu
                      </button>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-4 text-xs">
                      <div className="bg-white p-3 rounded-lg border border-stone-200">
                        <h4 className="font-bold text-stone-700 uppercase mb-2">🍳 Recettes clés</h4>
                        <ul className="list-disc list-inside space-y-1 text-slate-600">
                          {sem.recettes.map((rec, rIdx) => (
                            <li key={rIdx}>{rec.titre}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* Modal de remplacement */}
          {selectedSlot && (
            <div className="fixed inset-0 bg-stone-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-2xl max-w-md w-full shadow-xl border-2 border-orange-100">
                <h3 className="font-bold text-xl mb-1 text-amber-900">Remplacer le plat</h3>
                <p className="text-sm text-slate-500 mb-5">Plat actuel : <span className="line-through">{selectedSlot.oldTitle}</span></p>
                
                <select 
                  value={newRecipeChoice} 
                  onChange={e => setNewRecipeChoice(e.target.value)}
                  className="w-full p-3 border border-orange-200 rounded-xl mb-6 bg-orange-50/50 text-slate-800 focus:ring-orange-500 font-medium"
                >
                  {propositionsRemplacement.map((p, i) => (
                    <option key={i} value={p.nom}>{p.nom} - {p.desc}</option>
                  ))}
                </select>
                
                <div className="flex justify-end gap-3">
                  <button onClick={() => setSelectedSlot(null)} className="px-5 py-2.5 font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">Annuler</button>
                  <button onClick={confirmerRemplacement} className="px-5 py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-xl shadow-md transition">Valider</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
