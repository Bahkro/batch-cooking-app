<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Cooking - Application Web</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const planning = [
      { jour: "Lundi", midi: "Mijoté de butternut, pois chiches & coco (Riz / Substitut)", soir: "Velouté glacé de concombres & aneth" },
      { jour: "Mardi", midi: "🥧 Tarte fine aux poireaux & pommes", soir: "Gaspacho de tomates cerises & poivron jaune" },
      { jour: "Mercredi", midi: "Wok de brocolis, carottes & céleri au sésame", soir: "Mijoté de butternut & coco (Reste)" },
      { jour: "Jeudi", midi: "🥧 Tarte fine aux poireaux & pommes (Reste)", soir: "Wok de brocolis & carottes (Reste)" },
      { jour: "Vendredi", midi: "Salade fraîcheur (Riz/Substitut, concombre, maïs, radis)", soir: "Soupe froide de courgettes au basilic" }
    ];

    const courses = {
      legumes: [
        "1 courge butternut", "1,2 kg de poireaux", "2 pommes (Sainte-Germaine ou Golden)",
        "1 pied de brocoli", "800 g de carottes", "1/2 céleri-rave", "1 botte de radis",
        "2 concombres", "500 g de tomates cerises", "1 poivron jaune", "1,2 kg de courgettes",
        "Herbes : Aneth, basilic, persil"
      ],
      epicerie: [
        "1 conserve de pois chiches (Nicolas)", "1 brique de lait de coco (400 ml)",
        "Riz (Standard / Substitut PCU)", "Pâte brisée (Standard / Substitut PCU)",
        "Curry doux, graines de sésame, huile de sésame, huile d'olive"
      ],
      proteines: [
        "300 g de dinde ou poulet (Nicolas)", "100 g de chèvre frais ou feta (Nicolas)",
        "3 œufs & 15 cl de crème (Option quiche Nicolas)"
      ]
    };

    const recettes = [
      {
        titre: "1. Mijoté de butternut & lait de coco",
        base: "Saisissez des oignons émincés dans de l'huile d'olive avec 1 c.à.s. de curry doux. Ajoutez les dés de butternut, le lait de coco et du bouillon. Mijotez à feu doux 25 min.",
        nicolas: "Intégrez des dés de poulet poêlés et/ou des pois chiches à sa portion.",
        loic: "À déguster avec son riz adapté (substitut PCU)."
      },
      {
        titre: "2. Tarte fine aux poireaux & pommes",
        base: "Émincez les poireaux et faites-les fondre à la poêle. Étalez la pâte (standard/PCU), déposez les poireaux et disposez de fines tranches de pommes. Enfournez 35 min à 180°C.",
        nicolas: "Ajoutez un appareil œuf/crème et émiettez du fromage de chèvre.",
        loic: "Utiliser une pâte brisée adaptée (substitut PCU)."
      },
      {
        titre: "3. Wok de brocolis, carottes & céleri",
        base: "Détaillez le brocoli, coupez carottes et céleri en fine julienne. Faites sauter 10-12 min au wok avec huile de sésame et ail pour garder le croquant.",
        nicolas: "À accompagner d'un filet de dinde doré à la poêle.",
        loic: "Servir directement avec un féculent adapté."
      }
    ];

    const batchCookingSteps = [
      { temps: "T0 (0-20 min)", desc: "Découpez la butternut et les légumes du wok. Préparez la tarte fine aux poireaux/pommes et enfournez-la pour 35 min." },
      { temps: "T20 (20-50 min)", desc: "Lancez le mijoté de butternut et coco dans une grande sauteuse." },
      { temps: "T50 (50-80 min)", desc: "Préparez et mixez les 3 soupes glacées (concombre/aneth, gaspacho tomates/poivron, courgettes/basilic). Mettez en bouteilles au frais." },
      { temps: "T80 (80-100 min)", desc: "Faites sauter les légumes au wok. Lancez la cuisson du riz et du substitut PCU." },
      { temps: "T100 (100-120 min)", desc: "Cuisez les protéines de Nicolas et répartissez l'ensemble des préparations dans vos boîtes hermétiques." }
    ];

    function App() {
      const [tab, setTab] = useState('planning');

      return (
        <div class="max-w-4xl mx-auto p-4 space-y-6">
          <header class="text-center my-6">
            <h1 class="text-3xl font-bold text-emerald-700">🥘 Batch Cooking - Programme Web</h1>
            <p class="text-slate-600">Menus, recettes, liste de courses & organisation</p>
          </header>

          <!-- Navigation Onglets -->
          <div class="flex flex-wrap justify-center gap-2 border-b pb-4">
            <button onClick={() => setTab('planning')} class={`px-4 py-2 rounded-lg font-medium ${tab === 'planning' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>📅 Planning</button>
            <button onClick={() => setTab('courses')} class={`px-4 py-2 rounded-lg font-medium ${tab === 'courses' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>🛒 Courses</button>
            <button onClick={() => setTab('recettes')} class={`px-4 py-2 rounded-lg font-medium ${tab === 'recettes' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>🍳 Recettes</button>
            <button onClick={() => setTab('batch')} class={`px-4 py-2 rounded-lg font-medium ${tab === 'batch' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'}`}>⏱️ Batch Cooking (2h)</button>
          </div>

          <!-- Contingent Planning -->
          {tab === 'planning' && (
            <section class="bg-white p-6 rounded-xl shadow-md space-y-4">
              <h2 class="text-xl font-semibold text-emerald-600 border-b pb-2">📅 Planning de la Semaine</h2>
              <div class="grid gap-3">
                {planning.map((p, index) => (
                  <div key={index} class="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-slate-50 rounded-lg border">
                    <span class="font-bold text-slate-700 w-28">{p.jour}</span>
                    <div class="text-sm"><strong>Midi :</strong> {p.midi}</div>
                    <div class="text-sm"><strong>Soir :</strong> {p.soir}</div>
                  </div>
                ))}
              </div>
            </section>
          )}

          <!-- Contingent Courses -->
          {tab === 'courses' && (
            <section class="bg-white p-6 rounded-xl shadow-md space-y-6">
              <h2 class="text-xl font-semibold text-emerald-600 border-b pb-2">🛒 Liste de Courses</h2>
              <div class="grid sm:grid-cols-3 gap-4">
                <div class="bg-emerald-50 p-4 rounded-lg">
                  <h3 class="font-bold text-emerald-800 mb-2">🥦 Légumes & Fruits</h3>
                  <ul class="text-sm space-y-1 list-disc list-inside">
                    {courses.legumes.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
                <div class="bg-amber-50 p-4 rounded-lg">
                  <h3 class="font-bold text-amber-800 mb-2">📦 Épicerie & Féculents</h3>
                  <ul class="text-sm space-y-1 list-disc list-inside">
                    {courses.epicerie.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
                <div class="bg-rose-50 p-4 rounded-lg">
                  <h3 class="font-bold text-rose-800 mb-2">🥩 Protéines (Nicolas)</h3>
                  <ul class="text-sm space-y-1 list-disc list-inside">
                    {courses.proteines.map((item, i) => <li key={i}>{item}</li>)}
                  </ul>
                </div>
              </div>
            </section>
          )}

          <!-- Contingent Recettes -->
          {tab === 'recettes' && (
            <section class="bg-white p-6 rounded-xl shadow-md space-y-6">
              <h2 class="text-xl font-semibold text-emerald-600 border-b pb-2">🍳 Détail des Recettes</h2>
              <div class="space-y-4">
                {recettes.map((r, i) => (
                  <div key={i} class="border rounded-lg p-4 bg-slate-50 space-y-2">
                    <h3 class="font-bold text-lg text-slate-800">{r.titre}</h3>
                    <p class="text-sm"><strong>Base :</strong> {r.base}</p>
                    <div class="text-xs bg-blue-50 p-2 rounded text-blue-900"><strong>Nicolas :</strong> {r.nicolas}</div>
                    <div class="text-xs bg-purple-50 p-2 rounded text-purple-900"><strong>Loïc (PCU) :</strong> {r.loic}</div>
                  </div>
                ))}
              </div>
            </section>
          )}

          <!-- Contingent Batch Cooking -->
          {tab === 'batch' && (
            <section class="bg-white p-6 rounded-xl shadow-md space-y-6">
              <h2 class="text-xl font-semibold text-emerald-600 border-b pb-2">⏱️ Organisation du Batch Cooking (2h)</h2>
              <div class="space-y-3">
                {batchCookingSteps.map((step, i) => (
                  <div key={i} class="flex gap-4 items-start p-3 bg-slate-50 rounded-lg border">
                    <span class="font-bold text-emerald-700 whitespace-nowrap">{step.temps}</span>
                    <p class="text-sm text-slate-700">{step.desc}</p>
                  </div>
                ))}
              </div>
            </section>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
